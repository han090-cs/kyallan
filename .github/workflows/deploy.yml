name: Build, validate & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Extra permission is needed only by the keep-alive step; the deploy job does not get it.
    permissions:
      contents: read
      pages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      # GitHub pauses scheduled workflows after ~60 days without repository activity.
      # Re-enabling the workflow on every run resets that timer, so the 3-hourly refresh keeps going on its own.
      - name: Keep scheduled refresh alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Snapshot files must survive between ephemeral GitHub-hosted runners.
      # The unique key lets each run save refreshed data while restore-keys reuse the previous snapshot.
      - name: Restore last valid API snapshots
        uses: actions/cache@v4
        with:
          path: data-cache
          key: kyallan-data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kyallan-data-${{ runner.os }}-
      - name: Fetch live data (keep previous snapshot on source failure)
        run: node scripts/fetch-data.mjs
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      - name: Build static website
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Validate generated site
        run: node scripts/validate-site.mjs
      # Optional: also refresh the Vercel copy every run. Add a Vercel "Deploy Hook" URL as the
      # repository secret VERCEL_DEPLOY_HOOK; without it this step does nothing.
      - name: Trigger Vercel rebuild (optional)
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null && echo "Vercel rebuild triggered"; else echo "No VERCEL_DEPLOY_HOOK secret; skipped"; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
